<!DOCTYPE html>
<html lang="zh-CN" itemscope itemtype="https://schema.org/CollectionPage">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="${page_description}">
    <meta name="theme-color" content="${category_color}">
    <title>${page_title}</title>
    <link rel="canonical" href="${canonical_url}">
    <link rel="alternate" type="application/rss+xml" title="${site_name} RSS" href="${site_url}rss.xml">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="${page_title}">
    <meta property="og:description" content="${page_description}">
    <meta property="og:url" content="${canonical_url}">
    <meta property="og:image" content="${og_image}">
    <meta property="og:site_name" content="${site_name}">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="${page_title}">
    <meta name="twitter:description" content="${page_description}">
    <meta name="twitter:image" content="${og_image}">

    <!-- JSON-LD -->
    <script type="application/ld+json">${json_ld}</script>

    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="stylesheet" href="../assets/css/styles.css?v=${build_version}">
</head>
<body>
    <header class="header" role="banner">
        <div class="container">
            <h1 class="logo"><a href="../index.html" aria-label="${site_name} 首页">${site_name}</a></h1>
            <nav class="nav" role="navigation" aria-label="分类导航">
                ${nav_links}
            </nav>
        </div>
    </header>

    <main class="main" role="main">
        <div class="container">
            <header class="category-header" style="border-left-color: ${category_color};">
                <h1>${category_icon} ${category_name}</h1>
                <p>${site_name}${category_name}分类最新资讯</p>
            </header>

            <section class="news-grid" aria-labelledby="articles-heading">
                <h2 id="articles-heading" class="sr-only">${category_name}文章列表</h2>
                ${articles}
            </section>
        </div>
    </main>

    <footer class="footer" role="contentinfo">
        <div class="container">
            <p>&copy; ${current_year} ${site_name}. 保留所有权利.</p>
            <div class="footer-links">
                <a href="../index.html">首页</a>
                <a href="#">关于我们</a>
                <a href="#">联系方式</a>
                <a href="#">隐私政策</a>
                <a href="#">服务条款</a>
                <a href="../rss.xml">RSS 订阅</a>
            </div>
        </div>
    </footer>

    <script src="../assets/js/main.js?v=${build_version}"></script>
</body>
</html>
