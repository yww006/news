<!DOCTYPE html>
<html lang="zh-CN" itemscope itemtype="https://schema.org/NewsArticle">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="${page_description}">
    <meta name="theme-color" content="#2563eb">
    <meta name="author" content="${article_author}">
    <meta name="section" content="${article_section}">
    <meta name="tags" content="${article_tags}">
    <title>${page_title}</title>
    <link rel="canonical" href="${canonical_url}">
    <link rel="alternate" type="application/rss+xml" title="${site_name} RSS" href="${site_url}rss.xml">

    <!-- Open Graph -->
    <meta property="og:type" content="${og_type}">
    <meta property="og:title" content="${article_title}">
    <meta property="og:description" content="${page_description}">
    <meta property="og:url" content="${canonical_url}">
    <meta property="og:image" content="${og_image}">
    <meta property="og:site_name" content="${site_name}">
    <meta property="article:published_time" content="${article_published}">
    <meta property="article:modified_time" content="${article_modified}">
    <meta property="article:section" content="${article_section}">
    <meta property="article:tag" content="${article_tags}">
    <meta property="article:author" content="${article_author}">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="${article_title}">
    <meta name="twitter:description" content="${page_description}">
    <meta name="twitter:image" content="${og_image}">

    <!-- JSON-LD -->
    <script type="application/ld+json">${json_ld}</script>

    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header class="header" role="banner">
        <div class="container">
            <h1 class="logo"><a href="index.html" aria-label="${site_name} 首页">${site_name}</a></h1>
            <nav class="nav" role="navigation" aria-label="分类导航">
                ${nav_links}
            </nav>
        </div>
    </header>

    <main class="main" role="main">
        <article class="article-page" itemscope itemtype="https://schema.org/NewsArticle">
            <meta itemprop="datePublished" content="${article_published}">
            <meta itemprop="dateModified" content="${article_modified}">
            <meta itemprop="articleSection" content="${article_section}">
            <meta itemprop="keywords" content="${article_tags}">
            <meta itemprop="timeRequired" content="PT${article_read_time}M">
            <meta itemprop="author" content="${article_author}">
            <meta itemprop="publisher" content="${site_name}">

            <header class="article-header">
                ${article_category}
                <h1 itemprop="headline">${article_title}</h1>
                <div class="article-meta">
                    <span class="author" itemprop="author" itemscope itemtype="https://schema.org/Person">
                        <span itemprop="name">${article_author}</span>
                    </span>
                    <time class="date" itemprop="datePublished" datetime="${article_published}">${article_date}</time>
                    <span class="read-time">📖 ${article_read_time} 分钟阅读</span>
                </div>
            </header>

            <figure class="article-hero">
                <img src="${article_hero_image}" alt="${article_title}" itemprop="image" loading="eager">
            </figure>

            <div class="article-content" itemprop="articleBody">
                ${article_content}
            </div>

            <footer class="article-footer">
                <div class="article-tags">
                    <span>标签：</span>
                    <!-- Tags will be added via JS -->
                </div>
                <div class="article-share">
                    <span>分享：</span>
                    <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(article_title)}&url=${encodeURIComponent(canonical_url)}" target="_blank" rel="noopener" aria-label="分享到 Twitter">𝕏</a>
                    <a href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(canonical_url)}" target="_blank" rel="noopener" aria-label="分享到 LinkedIn">in</a>
                    <a href="https://api.whatsapp.com/send?text=${encodeURIComponent(article_title + ' ' + canonical_url)}" target="_blank" rel="noopener" aria-label="分享到 WhatsApp">⌘</a>
                    <button onclick="copyLink()" aria-label="复制链接">🔗</button>
                </div>
            </footer>

            ${related_articles ? `
            <section class="related-articles" aria-labelledby="related-heading">
                <h2 id="related-heading">相关阅读</h2>
                <div class="related-grid">
                    ${related_articles}
                </div>
            </section>` : ''}
        </article>
    </main>

    <footer class="footer" role="contentinfo">
        <div class="container">
            <p>&copy; ${current_year} ${site_name}. 保留所有权利.</p>
            <div class="footer-links">
                <a href="index.html">首页</a>
                <a href="#">关于我们</a>
                <a href="#">联系方式</a>
                <a href="#">隐私政策</a>
                <a href="#">服务条款</a>
                <a href="rss.xml">RSS 订阅</a>
            </div>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script>
        // Render tags
        const tags = "${article_tags}".split(',');
        const tagContainer = document.querySelector('.article-tags');
        if (tags[0]) {
            tags.forEach(tag => {
                const a = document.createElement('a');
                a.href = `category/${tag.trim().toLowerCase()}.html`;
                a.className = 'tag';
                a.textContent = tag.trim();
                tagContainer.appendChild(a);
            });
        }

        function copyLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const btn = event.target;
                const original = btn.textContent;
                btn.textContent = '✅';
                setTimeout(() => btn.textContent = original, 2000);
            });
        }

        // Reading progress
        const progressBar = document.createElement('div');
        progressBar.className = 'reading-progress';
        progressBar.setAttribute('role', 'progressbar');
        progressBar.setAttribute('aria-valuenow', '0');
        progressBar.setAttribute('aria-valuemin', '0');
        progressBar.setAttribute('aria-valuemax', '100');
        document.body.appendChild(progressBar);

        window.addEventListener('scroll', () => {
            const article = document.querySelector('.article-content');
            if (!article) return;
            const rect = article.getBoundingClientRect();
            const viewportHeight = window.innerHeight;
            const articleHeight = rect.height;
            const scrolled = Math.max(0, viewportHeight - rect.top);
            const progress = Math.min(100, (scrolled / (articleHeight + viewportHeight)) * 100);
            progressBar.style.width = progress + '%';
            progressBar.setAttribute('aria-valuenow', Math.round(progress));
        });
    </script>
</body>
</html>
